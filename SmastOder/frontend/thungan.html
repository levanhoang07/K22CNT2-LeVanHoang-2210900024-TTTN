<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>💵 Thu Ngân - Mì Cay One</title>

  <!-- Font + Icon -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- FontAwesome free CDN -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" integrity="sha512-..." crossorigin="anonymous" referrerpolicy="no-referrer" />

  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
  <link rel="stylesheet" href="css/thungan.css" />
</head>

<body>
  <!-- HEADER -->
  <header class="pos-header">
    <div class="header-left">
      <h1><img class="logo" src="image/logo.jpg" alt="Logo Mì Cay" style="height: 50px; width: auto;" />
          Thu ngân - Mì Cay One</h1>
    </div>
    <div class="header-right">
      <div class="time-display">
        <i class="fas fa-clock"></i>
        <span id="current-time">--:--:--</span>
      </div>
      <button class="btn-refresh" onclick="loadOrders()" title="Làm mới">
        <i class="fas fa-sync-alt"></i>
      </button>
    </div>
  </header>

  <!-- MAIN CONTENT -->
  <main class="pos-container">
    
    <!-- LEFT: DANH SÁCH ĐƠN HÀNG -->
    <section class="orders-panel">
      <div class="panel-header">
        <h2><i class="fas fa-list-ul"></i> Đơn hàng</h2>
        <span class="badge-count" id="order-count">0</span>
      </div>

      <!-- Bộ lọc -->
      <div class="filter-tabs">
        <button class="tab-btn active" onclick="filterOrders('all')">
          <i class="fas fa-border-all"></i> Tất cả
        </button>
        <button class="tab-btn" onclick="filterOrders('pending')">
          <i class="fas fa-clock"></i> Chờ thanh toán
        </button>
        <button class="tab-btn" onclick="filterOrders('paid')">
          <i class="fas fa-check-circle"></i> Đã thanh toán
        </button>
      </div>

      <!-- Danh sách đơn -->
      <div id="order-list" class="order-list"></div>
    </section>

    <!-- RIGHT: THANH TOÁN -->
    <section class="payment-panel" id="payment-panel">
      <div class="panel-header">
        <h2><i class="fas fa-calculator"></i> Thanh toán</h2>
      </div>

      <!-- Thông tin đơn đang chọn -->
      <div id="selected-order-info" class="order-info-box">
        <p class="no-selection">
          <i class="fas fa-hand-pointer"></i>
          Chọn một đơn hàng để thanh toán
        </p>
      </div>

      <!-- Chi tiết món -->
      <div id="order-items" class="items-container"></div>

      <!-- Tính tiền -->
      <div class="calculation-box">
        <div class="calc-row total">
          <span>Tổng cộng:</span>
          <span id="total-amount" class="amount">0 ₫</span>
        </div>
        <div class="calc-row discount">
          <span>Giảm giá:</span>
          <input type="number" id="discount-input" value="0" min="0" placeholder="0">
          <span>₫</span>
        </div>
        <div class="calc-row final">
          <span>Khách cần trả:</span>
          <span id="final-amount" class="amount">0 ₫</span>
        </div>
      </div>

      <!-- Phương thức thanh toán -->
      <div class="payment-method">
        <label class="method-label">Phương thức:</label>
        <div class="method-buttons">
          <button class="method-btn active" data-method="cash" onclick="selectPaymentMethod('cash')">
            <i class="fas fa-money-bill-wave"></i> Tiền mặt
          </button>
          <button class="method-btn" data-method="transfer" onclick="selectPaymentMethod('transfer')">
            <i class="fas fa-credit-card"></i> Chuyển khoản
          </button>
        </div>
      </div>

      <!-- Tiền khách đưa (chỉ hiện khi chọn tiền mặt) -->
      <div id="cash-payment-section" class="cash-section">
        <label>Khách đưa:</label>
        <div class="cash-input-group">
          <input type="number" id="customer-cash" placeholder="Nhập số tiền khách đưa" min="0">
          <span class="currency">₫</span>
        </div>
        <div class="quick-cash-buttons">
          <button onclick="setQuickCash(50000)">50k</button>
          <button onclick="setQuickCash(100000)">100k</button>
          <button onclick="setQuickCash(200000)">200k</button>
          <button onclick="setQuickCash(500000)">500k</button>
        </div>
        <div class="change-box">
          <span>Trả lại khách:</span>
          <span id="change-amount" class="amount change">0 ₫</span>
        </div>
      </div>

      <!-- QR Chuyển khoản -->
      <div id="transfer-qr-section" style="display:none; text-align:center; margin-top:1rem;">
        <img id="transfer-qr" src="" alt="QR Payment" style="max-width:200px; margin-bottom:0.5rem;">
        <p>Số tiền: <span id="transfer-amount">0 ₫</span></p>
        <p id="transfer-bank-info">Techcombank - STK: 6982121680</p>
      </div>

      <!-- Nút thanh toán -->
      <div class="action-buttons">
        <button class="btn-cancel" onclick="cancelPayment()">
          <i class="fas fa-times"></i> Hủy
        </button>
        <button class="btn-pay" onclick="processPayment()">
          <i class="fas fa-check-circle"></i> Thanh toán
        </button>
      </div>

      <!-- Thống kê -->
      <div class="stats-box">
        <h3><i class="fas fa-chart-pie"></i> Thống kê hôm nay</h3>
        <div class="stat-row">
          <span>Tổng đơn:</span>
          <strong id="stat-orders">0</strong>
        </div>
        <div class="stat-row">
          <span>Doanh thu:</span>
          <strong id="stat-revenue" class="revenue">0 ₫</strong>
        </div>
      </div>
    </section>

  </main>

  <!-- Modal chi tiết đơn -->
  <div id="order-detail-modal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h3><i class="fas fa-receipt"></i> Chi tiết đơn hàng</h3>
        <button class="btn-close" onclick="closeModal()">
          <i class="fas fa-times"></i>
        </button>
      </div>
      <div id="modal-body" class="modal-body"></div>
    </div>
  </div>

  <script src="js/thungan.js"></script>
</body>
</html>
