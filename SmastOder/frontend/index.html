<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mì Cay One - Nâng Tầng Hương Vị Việt</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
  <!-- Font & Icons -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/index.css" />

  <!-- Script -->
  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js" defer></script>
  <script src="js/client.js" defer></script>
</head>
<body>
  <!-- HEADER -->
  <header class="site-header">
    <div class="brand">
      <img class="logo" src="image/logo.jpg" alt="Logo Mì Cay" />
      <div class="brand-info">
        <h1>Mì Cay One</h1>
        <p>🍜<i> Nâng tầng hương vị Việt</i></p>
        <p class="address">📍 88 Hoàng Hoa Thám, Xuân Hòa, Phúc Yên, Vĩnh Phúc</p>
      </div>
    </div>
    <div class="table-meta">
      <label for="table-input">Bàn bạn đang sử dụng:</label>
      <input id="table-input" value="" readonly />
    </div>
  </header>

  <!-- MAIN -->
  <main class="layout">
    <!-- MENU -->
    <section class="menu">
      <div class="menu-head">
        <h2 class="text-center"><b>Thực đơn</b></h2>
        <input id="search" type="search" placeholder="🔍 Tìm món (mì, nước, topping...)" />
        <div class="category-bar">
          <button class="cat-btn active" data-cat="all">Tất cả</button>
        </div>
      </div>

      <div id="menu-container" class="menu-grid">
        <div class="loading-state">⏳ Đang tải thực đơn...</div>
      </div>
    </section>

    <!-- CART -->
    <aside class="cart">
      <h3>Giỏ hàng</h3>
      <div id="cart-list" class="cart-list">
        <div class="empty">🛒 Giỏ hàng trống. Hãy chọn món!</div>
      </div>
      <div class="cart-summary">
        <p>Tạm tính: <strong id="cart-subtotal">0 ₫</strong></p>
        <button id="btn-order" class="btn primary" disabled>Gửi đơn đặt hàng</button>
        <button id="btn-call-staff" class="btn btn-warning mt-3">
  📢 Gọi nhân viên
</button>

      </div>
    </aside>
  </main>

  <!-- MODAL -->
  <div id="option-modal" class="modal hidden">
    <div class="modal-content">
      <h3>Ghi chú: </h3>
      <label for="level-select">Cấp độ cay:</label>
      <select id="level-select">
        <option value="1">Cấp 1</option>
        <option value="2">Cấp 2</option>
        <option value="3">Cấp 3</option>
        <option value="4">Cấp 4</option>
        <option value="5">Cấp 5</option>
        <option value="6">Cấp 6</option>
        <option value="7">Cấp 7</option>
        <option value="khac">Khác</option>
      </select>

      <label for="note-input">Ghi chú:</label>
      <textarea id="note-input" rows="2" placeholder="Bạn cần gì hãy ghi chú cho quán biết nha"></textarea>

      <div class="modal-actions">
        <button id="cancel-modal" class="btn secondary">Hủy</button>
        <button id="confirm-modal" class="btn primary">Thêm vào giỏ</button>
      </div>
    </div>
  </div>

  <!-- FOOTER -->
  <footer class="site-footer">
    <p>© <span id="current-year"></span> Mì Cay One — Hỗ trợ kỹ thuật: 
      <a href="mailto:hotro@micayone.com">hotro@micayone.com</a><br>
      <a>Phát triển bởi - Hoang</a>
    </p>
  </footer>

  <script>
    document.getElementById('current-year').textContent = new Date().getFullYear();
    const params = new URLSearchParams(location.search);
    const table = params.get('table') || params.get('ban');
    if (table) document.getElementById('table-input').value = table;
  </script>
</body>
</html>
