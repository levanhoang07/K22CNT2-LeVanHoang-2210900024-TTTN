<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Bếp - SmartOrder</title>
  <link rel="stylesheet" href="/static/css/style.css" />
  <link rel="stylesheet" href="/static/css/bep.css" />
  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
</head>
<body>
  <header class="kitchen-header">
    <h1>👨‍🍳 Bếp - SmartOrder</h1>
    <div class="status-summary">
      <span>Đang chờ: <strong id="pending-count">0</strong></span>
      <span>Tổng đơn: <strong id="total-count">0</strong></span>
      <span id="current-time">--:--:--</span>
    </div>
  </header>

  <main>
    <h2>Đơn hàng (mới nhất lên đầu)</h2>
    <div id="order-list" class="order-grid" aria-live="polite">
      <p class="empty-list">Chưa có đơn hàng nào.</p>
    </div>
  </main>

  <script src="js/bep.js"></script>
</body>
</html>
