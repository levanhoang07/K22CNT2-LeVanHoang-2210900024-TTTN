<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Đăng nhập - Mỳ Cay One</title>

<link rel="stylesheet" href="static/css/login.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

<div class="container">

    <!-- LEFT -->
    <div class="left-box">
        <div class="brand">
            <i class="fa-solid fa-bowl-food"></i>
            <h1>Mỳ Cay One</h1>
        </div>
        <h2>Xin chào!</h2>
        <p class="slogan">Hệ thống Order chuyên nghiệp – nhanh chóng – chính xác</p>
    </div>

    <!-- RIGHT -->
    <div class="login-box">
        <h2>Đăng nhập</h2>

        <form id="login-form">

            <div class="input-field">
                <i class="fa-solid fa-user"></i>
                <input id="username" type="text" placeholder="Tài khoản">
            </div>

            <div class="input-field">
                <i class="fa-solid fa-lock"></i>
                <input id="password" type="password" placeholder="Mật khẩu">
            </div>

            <!-- CHỈ ĐỂ UI – KHÔNG DÙNG XÁC THỰC -->
            <div class="input-field">
                <i class="fa-solid fa-users"></i>
                <select id="role">
                    <option value="">Vaiai trò (tự động)</option>
                </select>
            </div>

            <div class="options">
                <label><input type="checkbox"> Ghi nhớ đăng nhập</label>
                <a class="forgot-btn" style="cursor:pointer;">Quên mật khẩu?</a>
            </div>

            <button class="btn" type="submit">Đăng nhập</button>

            <div id="login-error" class="error-msg"></div>
        </form>
    </div>
</div>

<!-- POPUP -->
<div class="forgot-popup" style="display:none;">
    <div class="popup-box">
        <h3>Quên mật khẩu</h3>
        <p>Liên hệ quản trị:</p>
        <p class="admin-info">
            📞 0909 999 999<br>
            ✉️ admin@mycayone.com
        </p>
        <button class="close-popup">Đóng</button>
    </div>
</div>

<script>
/* ===== POPUP ===== */
const popup = document.querySelector('.forgot-popup');
document.querySelector('.forgot-btn').onclick = () => popup.style.display = 'flex';
document.querySelector('.close-popup').onclick = () => popup.style.display = 'none';

/* ===== LOGIN ===== */
document.getElementById("login-form").addEventListener("submit", async function (e) {
    e.preventDefault();

    const ten_dang_nhap = document.getElementById("username").value.trim();
    const mat_khau = document.getElementById("password").value.trim();
    const errorBox = document.getElementById("login-error");

    errorBox.textContent = "";

    if (!ten_dang_nhap || !mat_khau) {
        errorBox.textContent = "⚠️ Vui lòng nhập tài khoản và mật khẩu!";
        return;
    }

    try {
        const res = await fetch("http://127.0.0.1:5000/api/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                ten_dang_nhap,
                mat_khau
            })
        });

        const result = await res.json();

        if (!result.success) {
            errorBox.textContent = result.message || "Sai tài khoản hoặc mật khẩu!";
            return;
        }

        // ✅ LẤY ROLE TỪ BACKEND
        const role = result.data.user.vai_tro;
        const token = result.data.token;

        localStorage.setItem("token", token);
        localStorage.setItem("role", role);

        // ✅ CHUYỂN TRANG
        switch (role) {
            case "Admin":
                window.location.href = "/admin";
                break;
            case "Bep":
                window.location.href = "/bep";
                break;
            case "ThuNgan":
                window.location.href = "/thungan";
                break;
            default:
                errorBox.textContent = "Vai trò không hợp lệ!";
        }

    } catch (err) {
        console.error(err);
        errorBox.textContent = "❌ Không thể kết nối server!";
    }
});
</script>

</body>
</html>
