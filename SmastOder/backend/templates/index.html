<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mì Cay One – QR Order</title>

<!-- Bootstrap CSS -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">

<!-- Google Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">

<!-- Custom CSS -->
<link rel="stylesheet" href="static/css/index.css">
</head>

<body>

<!-- ================= HEADER ================= -->
<header class="site-header">
  <div class="header-container">
    <div class="brand">
      <img src="static/image/logo.jpg" class="logo" alt="Logo">
      <div class="brand-info">
        <h1>🌶️ Mì Cay One</h1>
        <p>Nâng tầm hương vị Việt</p>
      </div>
    </div>
    <!-- ================= ADDRESS BAR ================= -->
<div class="address-bar">
  <p>88 Hoàng Hoa Thám, Xuân Hòa, Phúc Yên, Vĩnh Phúc</p>
</div>


    <div class="header-info">
      <div class="info-item">
        <span>⏰</span>
        <span><strong>9:00</strong> - <strong>22:00</strong></span>
      </div>
      <div class="info-item">
        <span>📞</span>
        <span><strong>0123 456 789</strong></span>
      </div>
      <div class="table-box">
        <label>Bàn:</label>
        <input id="table-input" readonly>
      </div>
    </div>
  </div>
</header>

<!-- ================= MAIN ================= -->
<main class="layout">

<!-- ===== MENU SECTION ===== -->
<section class="menu">
  <h2 class="text-center menu-title">Thực đơn</h2>

  <!-- Search Box -->
  <input
    id="search"
    class="form-control search-input"
    placeholder="🔍 Tìm món yêu thích..."
  >

  <!-- Category Bar (Dynamic) -->
  <div id="category-bar" class="category-bar">
    <div class="loading-state">⏳ Đang tải danh mục...</div>
  </div>

  <!-- Menu Grid (Dynamic) -->
  <div id="menu-container" class="menu-grid">
    <div class="loading-state">⏳ Đang tải menu...</div>
  </div>
</section>

<!-- ===== CART SECTION ===== -->
<aside class="cart">
  <h3 class="cart-title">🛒 Giỏ hàng</h3>

  <div id="cart-list">
    <div class="empty">Giỏ hàng đang trống<br>Hãy chọn món yêu thích! 😊</div>
  </div>

  <div class="cart-summary">
    <p class="summary-row">
      <span>Tạm tính:</span>
      <strong id="cart-subtotal">0 ₫</strong>
    </p>

    <button
      id="btn-order"
      class="btn btn-primary btn-order w-100"
      disabled
    >
      🍜 Gửi đơn hàng
    </button>

    <button
      id="btn-call-staff"
      class="btn btn-warning btn-call-staff w-100"
    >
      📢 Gọi nhân viên
    </button>
  </div>
</aside>

</main>

<!-- ================= MODAL CHỌN MÓN ================= -->
<div id="option-modal" class="modal hidden">
  <div class="modal-content">

    <!-- 🌶️ CHỈ MÓN MÌ MỚI HIỆN -->
    <div id="spicy-block">
      <label class="modal-label">Cấp độ cay</label>
      <select id="level-select" class="modal-select">
        <option value="1">Cấp 1 - Nhẹ nhàng</option>
        <option value="2">Cấp 2 - Vừa phải</option>
        <option value="3"> Cấp 3 - Cay vừa</option>
        <option value="4">Cấp 4 - Cay khá</option>
        <option value="5">Cấp 5 - Cay nhiều</option>
        <option value="6"> Cấp 6 - Cay đặc biệt</option>
        <option value="7">Cấp 7 - Siêu cay</option>
      </select>
    </div>

    <!-- 📝 LUÔN HIỆN -->
    <label class="modal-label">Ghi chú đặc biệt</label>
    <textarea
      id="note-input"
      rows="3"
      class="modal-textarea"
      placeholder="Ví dụ: Không hành, thêm rau..."
    ></textarea>

    <div class="modal-actions">
      <button id="confirm-modal" class="btn btn-primary">
        Thêm vào giỏ
      </button>
      <button id="cancel-modal" class="btn btn-secondary">
        Hủy
      </button>
    </div>

  </div>
</div>


<!-- ================= MODAL GỌI NHÂN VIÊN ================= -->
<div id="staff-modal" class="modal hidden">
  <div class="modal-content">
    <h4 class="modal-title">📢 Gọi nhân viên</h4>

    <textarea
      id="staff-message"
      rows="4"
      class="modal-textarea"
      placeholder="Nhập nội dung cần hỗ trợ...&#10;Ví dụ: Cần thêm nước, muốn thanh toán, v.v."
    ></textarea>

    <div class="modal-actions">
      <button id="send-staff" class="btn btn-primary">Gửi yêu cầu</button>
      <button id="close-staff-modal" class="btn btn-secondary">Hủy</button>
    </div>
  </div>
</div>
<!-- ===== BONG BÓNG LỊCH SỬ ===== -->
<div id="history-bubble" class="history-bubble">
  📜
  <span class="history-dot"></span>
</div>

<!-- ===== MODAL LỊCH SỬ ===== -->
<div id="history-modal" class="modal hidden">
  <div class="history-panel">
    <div class="history-header">
      <span>📜 Lịch sử đặt món</span>
      <button id="close-history">✕</button>
    </div>

    <div id="history-list" class="history-list">
      <div class="loading-state">Đang tải...</div>
    </div>
  </div>
</div>


<!-- ================= SCRIPTS ================= -->
<script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
<script src="{{ url_for('static', filename='js/client.js') }}"></script>

</body>
</html>
