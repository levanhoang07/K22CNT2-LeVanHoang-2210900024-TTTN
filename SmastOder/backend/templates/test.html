<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Mì Cay HoangChef – Đặt món</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/test.css">
</head>
<body>

<!-- ═══════════════════════════════════════════════════════════ -->
<!-- HEADER - STICKY TOP - DARK THEME -->
<!-- ═══════════════════════════════════════════════════════════ -->
<header class="app-header">
  <div class="header-content">
    <div class="header-left">
      <img src="/static/image/logo.jpg" alt="Logo" class="header-logo">
      <div class="header-info">
        <h1 class="header-title">Mì Cay HoangChef</h1>
        <p class="header-table" id="table-name">Bàn</p>
      </div>
    </div>
    
    <div class="header-actions">
      <!-- Nút lịch sử - luôn hiển thị -->
      <button class="btn-icon" id="btn-history" aria-label="Lịch sử đơn">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
          <line x1="16" y1="2" x2="16" y2="6"/>
          <line x1="8" y1="2" x2="8" y2="6"/>
          <line x1="3" y1="10" x2="21" y2="10"/>
        </svg>
      </button>
      
      <!-- Language switcher -->
      <div class="dropdown">
        <button class="btn-icon dropdown-toggle" data-bs-toggle="dropdown" aria-label="Ngôn ngữ">
          <span id="current-lang-flag">🇻🇳</span>
        </button>
        <ul class="dropdown-menu dropdown-menu-end">
          <li><a class="dropdown-item lang-item" data-lang="vi">🇻🇳 Tiếng Việt</a></li>
          <li><a class="dropdown-item lang-item" data-lang="en">🇺🇸 English</a></li>
          <li><a class="dropdown-item lang-item" data-lang="kr">🇰🇷 한국어</a></li>
        </ul>
      </div>
    </div>
  </div>
</header>

<!-- ═══════════════════════════════════════════════════════════ -->
<!-- MAIN CONTENT -->
<!-- ═══════════════════════════════════════════════════════════ -->
<main class="app-main">
  
  <!-- Search Bar -->
  <div class="search-container">
    <div class="search-box">
      <svg class="search-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="8"/>
        <path d="m21 21-4.35-4.35"/>
      </svg>
      <input 
        id="search" 
        type="text" 
        class="search-input" 
        placeholder="Tìm món ăn...">
    </div>
  </div>

  <!-- Category Tabs -->
  <div class="category-tabs" id="category-tabs">
    <button class="category-tab active" data-category="all">Tất cả</button>
    <button class="category-tab" data-category="1">Mì cay</button>
    <button class="category-tab" data-category="2">Đồ uống</button>
    <button class="category-tab" data-category="3">Tráng miệng</button>
  </div>

  <!-- Menu Grid -->
  <div class="menu-grid" id="menu-container">
    <!-- Items will be rendered here by JS -->
  </div>

</main>

<!-- ═══════════════════════════════════════════════════════════ -->
<!-- BOTTOM CART BAR - FIXED -->
<!-- ═══════════════════════════════════════════════════════════ -->
<div class="bottom-cart-bar" id="bottom-cart-bar">
  <div class="cart-bar-content" id="cart-bar-trigger">
    <div class="cart-bar-info">
      <svg class="cart-icon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="9" cy="21" r="1"/>
        <circle cx="20" cy="21" r="1"/>
        <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/>
      </svg>
      <div class="cart-details">
        <span class="cart-count" id="cart-count">0</span>
        <span class="cart-price" id="cart-total">0₫</span>
      </div>
    </div>
    <button class="btn-view-cart">
      Xem giỏ hàng
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3">
        <polyline points="18 15 12 9 6 15"/>
      </svg>
    </button>
  </div>
</div>

<!-- ═══════════════════════════════════════════════════════════ -->
<!-- BOTTOM SHEET - CART DETAIL -->
<!-- ═══════════════════════════════════════════════════════════ -->
<div class="bottom-sheet" id="cart-sheet">
  <div class="sheet-overlay" id="sheet-overlay"></div>
  <div class="sheet-content">
    <div class="sheet-handle"></div>
    
    <div class="sheet-header">
      <h2 class="sheet-title">Giỏ hàng của bạn</h2>
      <button class="btn-close-sheet" id="btn-close-sheet">✕</button>
    </div>
    
    <div class="sheet-body" id="cart-list">
      <div class="empty-cart">
        <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <circle cx="9" cy="21" r="1"/>
          <circle cx="20" cy="21" r="1"/>
          <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/>
        </svg>
        <p>Giỏ hàng trống</p>
      </div>
    </div>
    
    <div class="sheet-footer">
      <div class="cart-summary">
        <span>Tổng cộng</span>
        <strong id="cart-subtotal">0₫</strong>
      </div>
      
      <button class="btn-primary btn-order" id="btn-order" disabled>
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M22 2L11 13"/>
          <path d="M22 2l-7 20-4-9-9-4 20-7z"/>
        </svg>
        Gửi đơn hàng
      </button>
      
      <button class="btn-secondary btn-staff" id="btn-call-staff">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/>
        </svg>
        Gọi nhân viên
      </button>
      
      <button class="btn-secondary btn-review" id="btn-review">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>
        </svg>
        Đánh giá dịch vụ
      </button>
    </div>
  </div>
</div>

<!-- ═══════════════════════════════════════════════════════════ -->
<!-- MODAL - DISH OPTIONS -->
<!-- ═══════════════════════════════════════════════════════════ -->
<div class="modal-overlay hidden" id="option-modal">
  <div class="modal-dialog">
    <div class="modal-header">
      <h3 class="modal-title">Tùy chọn món ăn</h3>
      <button class="btn-close-modal" id="cancel-modal">✕</button>
    </div>
    
    <div class="modal-body">
      <div class="form-group" id="spicy-block">
        <label class="form-label">🌶️ Cấp độ cay</label>
        <select id="level-select" class="form-select">
          <option value="1">Cấp 1 - Nhẹ nhàng</option>
          <option value="2">Cấp 2 - Vừa phải</option>
          <option value="3" selected>Cấp 3 - Cay vừa</option>
          <option value="4">Cấp 4 - Cay khá</option>
          <option value="5">Cấp 5 - Cay mạnh</option>
          <option value="6">Cấp 6 - Siêu cay</option>
          <option value="7">Cấp 7 - Thách thức</option>
        </select>
      </div>
      
      <div class="form-group">
        <label class="form-label">📝 Ghi chú (tùy chọn)</label>
        <textarea id="note-input" class="form-textarea" rows="3" placeholder="Ví dụ: ít đá, không hành..."></textarea>
      </div>
    </div>
    
    <div class="modal-footer">
      <button class="btn-primary" id="confirm-modal">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="20 6 9 17 4 12"/>
        </svg>
        Thêm vào giỏ
      </button>
    </div>
  </div>
</div>

<!-- ═══════════════════════════════════════════════════════════ -->
<!-- MODAL - CALL STAFF -->
<!-- ═══════════════════════════════════════════════════════════ -->
<div class="modal-overlay hidden" id="staff-modal">
  <div class="modal-dialog">
    <div class="modal-header">
      <h3 class="modal-title">Gọi nhân viên hỗ trợ</h3>
      <button class="btn-close-modal" id="close-staff-modal">✕</button>
    </div>
    
    <div class="modal-body">
      <div class="form-group">
        <label class="form-label">Mô tả vấn đề</label>
        <textarea id="staff-message" class="form-textarea" rows="4" placeholder="Ví dụ: cần thêm nước, hóa đơn..."></textarea>
      </div>
    </div>
    
    <div class="modal-footer">
      <button class="btn-primary" id="send-staff">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M22 2L11 13"/>
          <path d="M22 2l-7 20-4-9-9-4 20-7z"/>
        </svg>
        Gửi yêu cầu
      </button>
    </div>
  </div>
</div>

<!-- ═══════════════════════════════════════════════════════════ -->
<!-- MODAL - REVIEW -->
<!-- ═══════════════════════════════════════════════════════════ -->
<div class="modal-overlay hidden" id="review-modal">
  <div class="modal-dialog">
    <div class="modal-header">
      <h3 class="modal-title">Đánh giá dịch vụ</h3>
      <button class="btn-close-modal" id="close-review-modal">✕</button>
    </div>
    
    <div class="modal-body">
      <div class="form-group">
        <label class="form-label">Tên của bạn (không bắt buộc)</label>
        <input id="review-name" type="text" class="form-input" placeholder="Nhập tên hoặc để trống">
      </div>
      
      <div class="form-group">
        <label class="form-label">Nội dung góp ý</label>
        <textarea id="review-content" class="form-textarea" rows="4" placeholder="Chia sẻ cảm nhận của bạn..." required></textarea>
      </div>
    </div>
    
    <div class="modal-footer">
      <button class="btn-primary" id="send-review">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M22 2L11 13"/>
          <path d="M22 2l-7 20-4-9-9-4 20-7z"/>
        </svg>
        Gửi đánh giá
      </button>
    </div>
  </div>
</div>

<!-- ═══════════════════════════════════════════════════════════ -->
<!-- MODAL - ORDER HISTORY -->
<!-- ═══════════════════════════════════════════════════════════ -->
<div class="modal-overlay hidden" id="history-modal">
  <div class="modal-dialog modal-lg">
    <div class="modal-header">
      <h3 class="modal-title">Lịch sử đơn hàng</h3>
      <button class="btn-close-modal" id="close-history">✕</button>
    </div>
    
    <div class="modal-body">
      <div id="history-list" class="history-list">
        <!-- Chat messages will be rendered here -->
      </div>
    </div>
  </div>
</div>

<!-- ═══════════════════════════════════════════════════════════ -->
<!-- SCRIPTS -->
<!-- ═══════════════════════════════════════════════════════════ -->
<script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="/static/js/landing.js"></script>
<script src="/static/js/lang-switcher.js"></script>

</body>
</html>
