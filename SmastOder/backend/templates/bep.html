<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bếp - Mì Cay One</title>

  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="/static/css/bep.css">
</head>

<body>

<!-- ═══════ HEADER ═══════ -->
<header class="kitchen-header">
  <div class="container-fluid">
    <div class="row align-items-center">
      <div class="col-md-4">
        <div class="logo-section">
          <img src="/static/image/logo.jpg" alt="Logo" class="logo-img">
          <div class="logo-text">
            <h1>🔥 BẾP</h1>
            <p>Mì Cay One Kitchen</p>
          </div>
        </div>
      </div>

      <div class="col-md-4 text-center">
        <div class="clock-section">
          <div class="clock-time" id="clock-time">00:00:00</div>
          <div class="clock-date" id="clock-date">Đang tải...</div>
        </div>
      </div>

      <div class="col-md-4">
        <div class="user-section text-end">
          <div class="chef-badge mb-2">
            <i class="fas fa-user-chef"></i>
            <span id="chef-name">Nhân viên bếp</span>
          </div>
          <button class="btn btn-outline-light btn-sm" id="btn-logout">
            <i class="fas fa-sign-out-alt"></i> Đăng xuất
          </button>
        </div>
      </div>
    </div>
  </div>
</header>
  <!-- Tabs -->
  <div class="text-center mb-3">
    <div class="tabs-container">
      <button class="tab-btn active" data-tab="waiting">
        <i class="fas fa-clock"></i>
        <span>Chờ làm</span>
        <span class="tab-badge" id="badge-waiting">0</span>
      </button>
      <button class="tab-btn" data-tab="cooking">
        <i class="fas fa-fire"></i>
        <span>Đang nấu</span>
        <span class="tab-badge" id="badge-cooking">0</span>
      </button>
      <button class="tab-btn" data-tab="completed">
        <i class="fas fa-check-circle"></i>
        <span>Hoàn thành</span>
        <span class="tab-badge" id="badge-completed">0</span>
      </button>
    </div>
  </div>

  <!-- 🔥 FILTER LỊCH SỬ (CHỈ DÙNG CHO TAB HOÀN THÀNH) -->
<div class="text-center mb-4" id="history-filter" style="display:none">
  <div class="btn-group">
    <button class="btn btn-outline-primary btn-sm history-btn active"
            data-type="day"
            onclick="switchHistoryType('day')">
      📅 Hôm nay
    </button>
    <button class="btn btn-outline-primary btn-sm history-btn"
            data-type="week"
            onclick="switchHistoryType('week')">
      📆 Tuần này
    </button>
    <button class="btn btn-outline-primary btn-sm history-btn"
            data-type="month"
            onclick="switchHistoryType('month')">
      🗓️ Tháng này
    </button>
  </div>
</div>


</div>

<!-- ═══════ ORDERS GRID ═══════ -->
<div class="orders-section">
  <div class="orders-grid" id="orders-grid">
    <div class="empty-state">
      <i class="fas fa-utensils"></i>
      <h3>Không có đơn hàng nào</h3>
    </div>
  </div>
</div>

<!-- Loading Overlay -->
<div class="loading-overlay" id="loading">
  <div class="spinner"></div>
</div>

<!-- Toast Container -->
<div class="toast-container" id="toast-container"></div>

<!-- SCRIPTS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
<script src="/static/js/bep.js"></script>

</body>
</html>
