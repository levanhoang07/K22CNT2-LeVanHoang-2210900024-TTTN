<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bếp - Mì Cay One</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ═══════ HEADER ═══════ */
    .kitchen-header {
      background: linear-gradient(135deg, #d63031, #e17055);
      color: white;
      padding: 20px 0;
      box-shadow: 0 4px 20px rgba(0,0,0,0.2);
      position: sticky;
      top: 0;
      z-index: 1000;
    }

    .logo-section {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .logo-img {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      border: 3px solid white;
      object-fit: cover;
    }

    .logo-text h1 {
      font-size: 2rem;
      font-weight: 900;
      margin: 0;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
    }

    .logo-text p {
      margin: 0;
      opacity: 0.9;
      font-size: 0.9rem;
    }

    .clock-section {
      background: rgba(255,255,255,0.2);
      padding: 15px 30px;
      border-radius: 15px;
      backdrop-filter: blur(10px);
      text-align: center;
    }

    .clock-time {
      font-size: 2rem;
      font-weight: 800;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
    }

    .clock-date {
      font-size: 0.9rem;
      opacity: 0.9;
    }

    .user-section {
      text-align: right;
    }

    .chef-badge {
      background: rgba(255,255,255,0.3);
      padding: 12px 25px;
      border-radius: 15px;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      backdrop-filter: blur(10px);
    }

    /* ═══════ STATS BAR ═══════ */
    .stats-container {
      padding: 20px;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
      margin-bottom: 20px;
    }

    .stat-box {
      background: white;
      padding: 25px;
      border-radius: 20px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.1);
      text-align: center;
      transition: all 0.3s ease;
      cursor: pointer;
    }

    .stat-box:hover {
      transform: translateY(-10px);
      box-shadow: 0 15px 40px rgba(0,0,0,0.2);
    }

    .stat-box.waiting {
      background: linear-gradient(135deg, #fdcb6e, #e17055);
    }

    .stat-box.cooking {
      background: linear-gradient(135deg, #fd79a8, #e84393);
    }

    .stat-box.completed {
      background: linear-gradient(135deg, #55efc4, #00b894);
    }

    .stat-box.today {
      background: linear-gradient(135deg, #74b9ff, #0984e3);
    }

    .stat-number {
      font-size: 3.5rem;
      font-weight: 900;
      color: white;
      text-shadow: 3px 3px 6px rgba(0,0,0,0.2);
      margin-bottom: 10px;
    }

    .stat-label {
      font-size: 1rem;
      font-weight: 700;
      color: white;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    /* ═══════ TABS ═══════ */
    .tabs-container {
      background: white;
      border-radius: 20px;
      padding: 10px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
      display: inline-flex;
      gap: 10px;
    }

    .tab-btn {
      padding: 15px 30px;
      border: none;
      background: transparent;
      border-radius: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.3s ease;
      color: #2d3436;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .tab-btn.active {
      background: linear-gradient(135deg, #d63031, #e17055);
      color: white;
      box-shadow: 0 4px 15px rgba(214, 48, 49, 0.3);
    }

    .tab-btn:hover:not(.active) {
      background: #f8f9fa;
    }

    .tab-badge {
      background: rgba(255,255,255,0.3);
      padding: 5px 12px;
      border-radius: 10px;
      font-weight: 800;
      min-width: 30px;
      text-align: center;
    }

    /* ═══════ ORDER GRID ═══════ */
    .orders-section {
      padding: 20px;
    }

    .orders-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
      gap: 20px;
    }

    .order-card {
      background: white;
      border-radius: 20px;
      padding: 25px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.1);
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
    }

    .order-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 5px;
      background: linear-gradient(90deg, #d63031, #e17055);
    }

    .order-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 15px 40px rgba(0,0,0,0.2);
    }

    .order-card.urgent {
      border: 3px solid #d63031;
      animation: urgentPulse 2s infinite;
    }

    @keyframes urgentPulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(214, 48, 49, 0.7); }
      50% { box-shadow: 0 0 0 20px rgba(214, 48, 49, 0); }
    }

    .order-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      padding-bottom: 15px;
      border-bottom: 2px solid #f8f9fa;
    }

    .table-name {
      background: linear-gradient(135deg, #d63031, #e17055);
      color: white;
      padding: 12px 25px;
      border-radius: 15px;
      font-size: 1.3rem;
      font-weight: 800;
      display: inline-flex;
      align-items: center;
      gap: 10px;
    }

    .order-time-info {
      text-align: right;
    }

    .order-time {
      font-size: 1.1rem;
      font-weight: 700;
      color: #2d3436;
      display: flex;
      align-items: center;
      gap: 8px;
      justify-content: flex-end;
    }

    .time-elapsed {
      font-size: 0.85rem;
      color: #d63031;
      font-weight: 600;
    }

    .order-id {
      font-size: 0.9rem;
      color: #636e72;
      margin-top: 5px;
    }

    .items-list {
      margin-bottom: 20px;
    }

    .item-row {
      background: #f8f9fa;
      padding: 15px;
      border-radius: 12px;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: all 0.2s ease;
    }

    .item-row:hover {
      background: #e9ecef;
      transform: translateX(5px);
    }

    .item-info {
      flex: 1;
    }

    .item-name {
      font-size: 1.1rem;
      font-weight: 700;
      color: #2d3436;
      margin-bottom: 5px;
    }

    .item-meta {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .meta-badge {
      padding: 4px 12px;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 600;
    }

    .badge-spicy {
      background: #ff6b6b;
      color: white;
    }

    .badge-note {
      background: #74b9ff;
      color: white;
    }

    .item-qty {
      background: linear-gradient(135deg, #d63031, #e17055);
      color: white;
      padding: 8px 20px;
      border-radius: 12px;
      font-size: 1.3rem;
      font-weight: 800;
    }

    .order-actions {
      display: flex;
      gap: 10px;
    }

    .btn-action {
      flex: 1;
      padding: 15px;
      border: none;
      border-radius: 12px;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .btn-action:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 20px rgba(0,0,0,0.2);
    }

    .btn-start {
      background: linear-gradient(135deg, #fd79a8, #e84393);
      color: white;
    }

    .btn-complete {
      background: linear-gradient(135deg, #55efc4, #00b894);
      color: white;
    }

    .btn-cancel {
      background: linear-gradient(135deg, #b2bec3, #636e72);
      color: white;
      flex: 0.3;
    }

    /* ═══════ STATUS BADGES ═══════ */
    .status-badge {
      position: absolute;
      top: 25px;
      right: 25px;
      padding: 8px 20px;
      border-radius: 20px;
      font-weight: 700;
      font-size: 0.9rem;
      animation: statusBlink 2s infinite;
    }

    .status-cooking {
      background: #fd79a8;
      color: white;
    }

    .status-completed {
      background: #00b894;
      color: white;
    }

    @keyframes statusBlink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.7; }
    }

    /* ═══════ EMPTY STATE ═══════ */
    .empty-state {
      text-align: center;
      padding: 80px 20px;
      grid-column: 1 / -1;
    }

    .empty-state i {
      font-size: 5rem;
      color: #dfe6e9;
      margin-bottom: 20px;
    }

    .empty-state h3 {
      color: #636e72;
      font-weight: 700;
    }

    /* ═══════ TOAST ═══════ */
    .toast-container {
      position: fixed;
      top: 100px;
      right: 20px;
      z-index: 10000;
    }

    .toast-custom {
      background: white;
      padding: 20px 25px;
      border-radius: 15px;
      margin-bottom: 15px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.3);
      min-width: 350px;
      animation: toastSlide 0.3s ease-out;
      border-left: 5px solid;
    }

    @keyframes toastSlide {
      from { transform: translateX(400px); opacity: 0; }
      to { transform: translateX(0); opacity: 1; }
    }

    .toast-custom.success { border-left-color: #00b894; }
    .toast-custom.info { border-left-color: #0984e3; }
    .toast-custom.warning { border-left-color: #fdcb6e; }

    /* ═══════ LOADING ═══════ */
    .loading-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.7);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      backdrop-filter: blur(5px);
    }

    .loading-overlay.show {
      display: flex;
    }

    .spinner {
      width: 60px;
      height: 60px;
      border: 5px solid rgba(255,255,255,0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* ═══════ RESPONSIVE ═══════ */
    @media (max-width: 768px) {
      .orders-grid {
        grid-template-columns: 1fr;
      }
      .stat-number {
        font-size: 2.5rem;
      }
      .clock-time {
        font-size: 1.5rem;
      }
    }
  </style>
</head>

<body>

<!-- ═══════ HEADER ═══════ -->
<header class="kitchen-header">
  <div class="container-fluid">
    <div class="row align-items-center">
      <div class="col-md-4">
        <div class="logo-section">
          <img src="/static/images/logo.jpg" alt="Logo" class="logo-img">
          <div class="logo-text">
            <h1>🔥 BẾP</h1>
            <p>Mì Cay One Kitchen</p>
          </div>
        </div>
      </div>
      
      <div class="col-md-4 text-center">
        <div class="clock-section">
          <div class="clock-time" id="clock-time">00:00:00</div>
          <div class="clock-date" id="clock-date">Đang tải...</div>
        </div>
      </div>
      
      <div class="col-md-4">
        <div class="user-section">
          <div class="chef-badge">
            <i class="fas fa-user-chef"></i>
            <span id="chef-name">Bếp trưởng</span>
          </div>
          <button class="btn btn-outline-light mt-2" id="btn-logout">
            <i class="fas fa-sign-out-alt"></i> Đăng xuất
          </button>
        </div>
      </div>
    </div>
  </div>
</header>

<!-- ═══════ STATS ═══════ -->
<div class="stats-container">
  <div class="stats-grid">
    <div class="stat-box waiting">
      <div class="stat-number" id="stat-waiting">0</div>
      <div class="stat-label">⏳ Chờ làm</div>
    </div>
    <div class="stat-box cooking">
      <div class="stat-number" id="stat-cooking">0</div>
      <div class="stat-label">🔥 Đang nấu</div>
    </div>
    <div class="stat-box completed">
      <div class="stat-number" id="stat-completed">0</div>
      <div class="stat-label">✅ Hoàn thành</div>
    </div>
    <div class="stat-box today">
      <div class="stat-number" id="stat-today">0</div>
      <div class="stat-label">📊 Hôm nay</div>
    </div>
  </div>

  <!-- Tabs -->
  <div class="text-center mb-4">
    <div class="tabs-container">
      <button class="tab-btn active" data-tab="waiting">
        <i class="fas fa-clock"></i>
        <span>Chờ làm</span>
        <span class="tab-badge" id="badge-waiting">0</span>
      </button>
      <button class="tab-btn" data-tab="cooking">
        <i class="fas fa-fire"></i>
        <span>Đang nấu</span>
        <span class="tab-badge" id="badge-cooking">0</span>
      </button>
      <button class="tab-btn" data-tab="completed">
        <i class="fas fa-check-circle"></i>
        <span>Hoàn thành</span>
        <span class="tab-badge" id="badge-completed">0</span>
      </button>
    </div>
  </div>
</div>

<!-- ═══════ ORDERS GRID ═══════ -->
<div class="orders-section">
  <div class="orders-grid" id="orders-grid">
    <div class="empty-state">
      <i class="fas fa-utensils"></i>
      <h3>Không có đơn hàng nào</h3>
    </div>
  </div>
</div>

<!-- Loading Overlay -->
<div class="loading-overlay" id="loading">
  <div class="spinner"></div>
</div>

<!-- Toast Container -->
<div class="toast-container" id="toast-container"></div>

<!-- SCRIPTS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
<script src="/static/js/bep.js"></script>

</body>
</html>
