<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bếp - Mì Cay HoangChef</title>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/bep.css') }}">

</head>

<body>

<!-- ═══════ HEADER ═══════ -->
<header class="kitchen-header">
  <div class="header-container">
    
    <div class="logo-section">
      <img src="/static/image/logo.jpg" alt="Logo" class="logo-img">
      <div class="logo-text">
        <h1>BẾP</h1>
        <p>Mì Cay HoangChef</p>
      </div>
    </div>

    <div class="clock-section">
      <div class="clock-time" id="clock-time">00:00:00</div>
      <div class="clock-date" id="clock-date">Đang tải...</div>
    </div>

    <div class="user-section">
      <div class="chef-badge">
        <i class="fas fa-user-chef"></i>
        <span id="chef-name">Nhân viên bếp</span>
      </div>
      <button class="btn-logout" id="btn-logout">
        <i class="fas fa-sign-out-alt"></i> Đăng xuất
      </button>
    </div>

  </div>
</header>

<!-- ═══════ STATS CARDS ═══════ -->
<section class="stats-section">
  <div class="stats-grid">
    <div class="stat-card">
      <div class="stat-icon waiting">
        <i class="fas fa-clock"></i>
      </div>
      <div class="stat-info">
        <h3>Chờ làm</h3>
        <div class="stat-number" id="stat-waiting">0</div>
      </div>
    </div>

    <div class="stat-card">
      <div class="stat-icon cooking">
        <i class="fas fa-fire"></i>
      </div>
      <div class="stat-info">
        <h3>Đang nấu</h3>
        <div class="stat-number" id="stat-cooking">0</div>
      </div>
    </div>

    <div class="stat-card">
      <div class="stat-icon completed">
        <i class="fas fa-check-circle"></i>
      </div>
      <div class="stat-info">
        <h3>Hoàn thành</h3>
        <div class="stat-number" id="stat-completed">0</div>
      </div>
    </div>

    <div class="stat-card">
      <div class="stat-icon today">
        <i class="fas fa-calendar-day"></i>
      </div>
      <div class="stat-info">
        <h3>Tổng hôm nay</h3>
        <div class="stat-number" id="stat-today">0</div>
      </div>
    </div>
  </div>
</section>

<!-- ═══════ TABS ═══════ -->
<section class="tabs-section">
  <div class="tabs-container">
    <button class="tab-btn active" data-tab="waiting">
      <i class="fas fa-clock"></i>
      <span>Chờ làm</span>
      <span class="tab-badge" id="badge-waiting">0</span>
    </button>
    <button class="tab-btn" data-tab="cooking">
      <i class="fas fa-fire"></i>
      <span>Đang nấu</span>
      <span class="tab-badge" id="badge-cooking">0</span>
    </button>
    <button class="tab-btn" data-tab="completed">
      <i class="fas fa-check-circle"></i>
      <span>Hoàn thành</span>
      <span class="tab-badge" id="badge-completed">0</span>
    </button>
  </div>
</section>

<!-- ═══════ FILTER LỊCH SỬ ═══════ -->
<div id="history-filter">
  <button class="history-btn active" data-type="day" onclick="switchHistoryType('day')">
    📅 Hôm nay
  </button>
  <button class="history-btn" data-type="week" onclick="switchHistoryType('week')">
    📆 Tuần này
  </button>
  <button class="history-btn" data-type="month" onclick="switchHistoryType('month')">
    🗓️ Tháng này
  </button>
</div>

<!-- ═══════ TABLES GRID ═══════ -->
<section class="tables-section">
  <div class="tables-grid" id="tables-grid">
    <div class="empty-state">
      <i class="fas fa-utensils"></i>
      <h3>Không có đơn hàng nào</h3>
      <p>Đơn hàng sẽ xuất hiện ở đây khi có</p>
    </div>
  </div>
</section>

<!-- ═══════ MODAL CHI TIẾT ĐƠN HÀNG ═══════ -->
<div class="modal-overlay" id="order-modal">
  <div class="modal-content">
    
    <div class="modal-header">
      <h2 id="modal-title">
        <i class="fas fa-utensils"></i>
        Chi tiết đơn hàng
      </h2>
      <button class="close-btn" onclick="closeModal()">
        <i class="fas fa-times"></i>
      </button>
    </div>

    <div class="modal-body" id="modal-body">
      <!-- Content will be rendered here -->
    </div>

  </div>
</div>

<!-- Loading Overlay -->
<div class="loading-overlay" id="loading">
  <div class="spinner"></div>
</div>

<!-- Toast Container -->
<div class="toast-container" id="toast-container"></div>

<!-- SCRIPTS -->
<script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
<script src="/static/js/bep.js"></script>

</body>
</html>
